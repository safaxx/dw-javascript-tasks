<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="quiz-container">

        <h1>🗺️ Hello, Geo Nerd</h1>
        <p class="subtitle">Choose the correct capital.</p>

        <div class="score">
            Score: <span id="score">0</span>    
        </div>
        <p id="result"></p>

        <div class="quiz-card">

            <h2 id="question">
                What's the capital of <span class="country">India?</span>
            </h2>

            <div id="answers" class="answers"></div>

        </div>
        <!-- <button id="check-ans" class="btn">Check Answer</button> -->
        <button id="next-btn">Next Question</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
